# =============================================================
# Layer: BI / Visualization  (Metabase)
# Namespace: newslake-bi
# =============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-data
  namespace: newslake-bi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: newslake-bi
spec:
  replicas: 1
  selector: { matchLabels: { app: metabase } }
  template:
    metadata: { labels: { app: metabase } }
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:v0.50.20
          env:
            - { name: MB_DB_FILE, value: /metabase-data/metabase.db }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: data, mountPath: /metabase-data }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: metabase-data }
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: newslake-bi
spec:
  type: NodePort
  selector: { app: metabase }
  ports:
    - { port: 3000, targetPort: 3000, nodePort: 30030 }
